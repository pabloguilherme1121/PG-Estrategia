name: Domínio Territorial mobile e offline
on:
  pull_request:
    paths:
      - 'public/estrategia/independentes/dominio-territorial/**'
      - 'e2e/dominio-territorial.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dominio-territorial.yml'
  push:
    branches: [feat/dominio-territorial-hex-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    name: SVG, toque e PWA Chromium/WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dominio-territorial-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
