name: Qualidade PG Estratégia

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Motores, PG Bot e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Instalar dependências fixadas pelo lockfile
        run: npm ci --ignore-scripts
      - name: Auditar dependências de desenvolvimento e transitivas
        run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
